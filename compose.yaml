name: ai-workspace

services:
  web:
    build: .
    image: ai-workspace:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      TN_BIND_HOST: 0.0.0.0
      PORT: "4317"
      TN_WORK_ROOT: /workspace
      TN_AI_DOCS_ROOT: /app/data/brand-docs
      TN_STUDIO_LOG_CATALOG: "1"
      TN_STUDIO_READ_ONLY: "1"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ..
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
