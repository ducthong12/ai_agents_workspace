<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — TN Workspace</title><link rel="icon" href="/tn-logo.png"><link rel="stylesheet" href="/style.css"></head><body class="login-page"><section class="login-card"><a class="login-brand" href="/login"><img src="/tn-logo.png" alt="TN" width="92" height="92"><span>TN WORKSPACE</span></a><form id="login-form"><label>Tên đăng nhập<input id="username" name="username" autocomplete="username" required placeholder="Tên đăng nhập" autofocus maxlength="100"></label><label>Mật khẩu<div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu" maxlength="1000"><button type="button" id="show-password" aria-label="Hiện mật khẩu">Hiện</button></div></label><div id="login-error" class="error" role="alert" hidden></div><button class="button primary login-submit" id="login-submit" type="submit">Đăng nhập <span aria-hidden="true">↗</span></button></form><div class="login-footer"><span class="status-dot"></span> Không gian cá nhân · Kết nối trên máy này</div></section><script src="/login.js" type="module"></script></body></html>
